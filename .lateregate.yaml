# The identity shape of the family: specs/infrastructure/identity.md in latere-ai/specs.
# This repository verifies no token and mints none, so it holds no rule of the shape;
# the family check reads the role and lists it.
identity:
  role: none

release:
  # `lateregate release vX.Y.Z` rewrites these in the release commit, so the
  # package and the install example in the README name the tag they ship in.
  # The patterns carry their context: the README also names an old v1.x tag
  # as an example, which a bare version pattern would match too.
  stamp:
    - file: package.json
      pattern: '"version": "\d+\.\d+\.\d+"'
    - file: README.md
      pattern: 'bun add github:latere-ai/latere-ui#v\d+\.\d+\.\d+'

frontend:
  # The root is the package. The gate installs from the lockfile, then runs the
  # typecheck script (both tsconfigs, so the React 18 types stay honest) and the
  # test script, which runs with coverage so the 90 percent line floor in
  # vitest.config.ts holds on every push. The browser suite needs the macOS
  # references and stays in visual.yml.
  projects: ['.']
