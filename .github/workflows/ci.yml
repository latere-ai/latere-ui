name: ci

# A push or pull request that changes only specs or markdown starts no run,
# because no build or test here reads them. `lateregate release` runs the whole
# bar, the spec tree included, before every tag.
on:
  push:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "specs/**"
      - "**.md"
permissions:
  contents: read
jobs:
  check:
    # Typecheck and unit tests render nothing, so they run on Linux; the
    # browser suite needs the macOS references and runs in visual.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:coverage
