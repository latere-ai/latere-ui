name: UI verification
on:
  # Typecheck and unit tests run on Linux in ci.yml for every change. This
  # macOS job runs only when a change can alter a render, so a change to
  # specs or Markdown alone skips it.
  push:
    branches: [main]
    paths-ignore:
      - "specs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "specs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      record_goldens:
        description: 'Record review artifacts only; never commit or approve them automatically'
        type: boolean
        default: false
      record_grep:
        description: 'Optional Playwright title pattern for candidate recording; blank records all tests'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    # Golden paths include the OS: do not compare a Linux render to a macOS PNG.
    runs-on: macos-15
    # Every golden figure at high resolution plus behavioral and state regressions.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run test:visual
        if: ${{ !inputs.record_goldens }}
      - run: bun run test:visual:update --grep "${RECORDING_GREP:-.*}"
        if: ${{ inputs.record_goldens }}
        env:
          RECORDING_GREP: ${{ inputs.record_grep }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.record_goldens }}
        with:
          name: golden-candidates
          if-no-files-found: error
          path: tests/visual/goldens/darwin-24/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-comparison-report
          path: output/playwright/
          retention-days: 14
