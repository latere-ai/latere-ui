name: UI verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_goldens:
        description: 'Record review artifacts only; never commit or approve them automatically'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    # Golden paths include the OS: do not compare a Linux render to a macOS PNG.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run test:visual
        if: ${{ !inputs.record_goldens }}
      - run: bun run test:visual:update
        if: ${{ inputs.record_goldens }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.record_goldens }}
        with:
          name: golden-candidates
          if-no-files-found: error
          path: tests/visual/goldens/darwin-24/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-comparison-report
          path: output/playwright/
          retention-days: 14
